name: Release VPM Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp package.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Read package name
        id: pkg
        run: echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        id: zip
        run: |
          ZIP_NAME="${{ steps.pkg.outputs.name }}-${{ steps.version.outputs.version }}.zip"
          STAGE_DIR="$(mktemp -d)"
          rsync -a --exclude='.git' --exclude='.github' ./ "$STAGE_DIR"/
          (cd "$STAGE_DIR" && zip -rq "$GITHUB_WORKSPACE/$ZIP_NAME" .)
          sha256sum "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.zip.outputs.zip_name }}" \
            "${{ steps.zip.outputs.zip_name }}.sha256" \
            "package.json" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "VRChatTools ${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Build index.json
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          PKG_NAME="${{ steps.pkg.outputs.name }}"
          WORK_DIR="$(mktemp -d)"
          VERSIONS_JSON="$WORK_DIR/versions.json"
          echo '{}' > "$VERSIONS_JSON"

          for TAG in $(gh release list --repo "$REPO" --limit 200 --json tagName -q '.[].tagName'); do
            ASSETS_JSON=$(gh release view "$TAG" --repo "$REPO" --json assets)

            PKG_URL=$(echo "$ASSETS_JSON" | jq -r '.assets[] | select(.name == "package.json") | .url')
            ZIP_ASSET_NAME=$(echo "$ASSETS_JSON" | jq -r --arg n "$PKG_NAME" '.assets[] | select(.name | startswith($n + "-") and endswith(".zip")) | .name')
            SHA_ASSET_NAME=$(echo "$ASSETS_JSON" | jq -r --arg n "$PKG_NAME" '.assets[] | select(.name | startswith($n + "-") and endswith(".zip.sha256")) | .name')

            if [ -z "$PKG_URL" ] || [ "$PKG_URL" = "null" ] || [ -z "$ZIP_ASSET_NAME" ] || [ "$ZIP_ASSET_NAME" = "null" ]; then
              echo "Skipping $TAG: missing package.json or zip asset"
              continue
            fi

            ZIP_URL=$(echo "$ASSETS_JSON" | jq -r --arg n "$ZIP_ASSET_NAME" '.assets[] | select(.name == $n) | .url')

            curl -sL "$PKG_URL" -o "$WORK_DIR/pkg.json"
            VERSION=$(jq -r .version "$WORK_DIR/pkg.json")

            SHA=""
            if [ -n "$SHA_ASSET_NAME" ] && [ "$SHA_ASSET_NAME" != "null" ]; then
              SHA_URL=$(echo "$ASSETS_JSON" | jq -r --arg n "$SHA_ASSET_NAME" '.assets[] | select(.name == $n) | .url')
              SHA=$(curl -sL "$SHA_URL" | awk '{print $1}')
            fi

            ENTRY=$(jq --arg url "https://github.com/$REPO/releases/download/$TAG/$ZIP_ASSET_NAME" --arg sha "$SHA" \
              '. + {url: $url} + (if $sha != "" then {zipSHA256: $sha} else {} end)' "$WORK_DIR/pkg.json")

            jq --arg v "$VERSION" --argjson entry "$ENTRY" '.[$v] = $entry' "$VERSIONS_JSON" > "$WORK_DIR/versions.json.tmp"
            mv "$WORK_DIR/versions.json.tmp" "$VERSIONS_JSON"
          done

          jq -n \
            --arg name "VRChatTools" \
            --arg id "com.kama-boko-vrc.vrchat-tools-repo" \
            --arg author "kama-boko-vrc" \
            --arg url "https://kama-boko-vrc.github.io/VRChatTools/index.json" \
            --arg pkgName "$PKG_NAME" \
            --slurpfile versions "$VERSIONS_JSON" \
            '{name: $name, id: $id, author: $author, url: $url, packages: {($pkgName): {versions: $versions[0]}}}' \
            > "$WORK_DIR/index.json"

          echo "index_path=$WORK_DIR/index.json" >> "$GITHUB_OUTPUT"

      - name: Publish index.json to GitHub Pages
        run: |
          set -euo pipefail
          INDEX_PATH="${{ steps.index.outputs.index_path }}"
          WORKTREE="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages "$WORKTREE" origin/gh-pages
          else
            git worktree add -b gh-pages "$WORKTREE" HEAD
            git -C "$WORKTREE" rm -rf . > /dev/null 2>&1 || true
          fi

          cp "$INDEX_PATH" "$WORKTREE/index.json"
          git -C "$WORKTREE" add index.json
          git -C "$WORKTREE" commit -m "Update index.json for ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git -C "$WORKTREE" push origin gh-pages