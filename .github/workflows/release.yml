name: Release VPM Package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp package.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Read package name
        id: pkg
        run: echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        id: zip
        run: |
          ZIP_NAME="${{ steps.pkg.outputs.name }}-${{ steps.version.outputs.version }}.zip"
          STAGE_DIR="$(mktemp -d)"
          rsync -a --exclude='.git' --exclude='.github' ./ "$STAGE_DIR"/
          (cd "$STAGE_DIR" && zip -rq "$GITHUB_WORKSPACE/$ZIP_NAME" .)
          sha256sum "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.zip.outputs.zip_name }}" \
            "${{ steps.zip.outputs.zip_name }}.sha256" \
            "package.json" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "VRChatTools ${{ steps.version.outputs.version }}" \
            --repo "${{ github.repository }}"

      - name: Build version entry
        id: index
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          WORK_DIR="$(mktemp -d)"

          SHA=$(awk '{print $1}' "$ZIP_NAME.sha256")

          jq --arg url "https://github.com/$REPO/releases/download/$TAG/$ZIP_NAME" --arg sha "$SHA" \
            '. + {url: $url, zipSHA256: $sha}' package.json > "$WORK_DIR/entry.json"

          echo "entry_path=$WORK_DIR/entry.json" >> "$GITHUB_OUTPUT"

      - name: Publish index.json to GitHub Pages
        run: |
          set -euo pipefail
          ENTRY_PATH="${{ steps.index.outputs.entry_path }}"
          PKG_NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.version.outputs.version }}"
          WORKTREE="$(mktemp -d)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add -B gh-pages "$WORKTREE" origin/gh-pages
          else
            git worktree add -b gh-pages "$WORKTREE" HEAD
            git -C "$WORKTREE" rm -rf . > /dev/null 2>&1 || true
          fi

          # 既存のindex.jsonに新バージョンをマージし、過去バージョンの情報を保持する
          # （VCC/ALCOM側で過去バージョンを選択インストールできるようにするため）。
          if [ ! -f "$WORKTREE/index.json" ]; then
            jq -n \
              --arg name "VRChatTools" \
              --arg id "com.kama-boko-vrc.vrchat-tools-repo" \
              --arg author "kama-boko-vrc" \
              --arg url "https://kama-boko-vrc.github.io/VRChatTools/index.json" \
              '{name: $name, id: $id, author: $author, url: $url, packages: {}}' \
              > "$WORKTREE/index.json"
          fi

          jq --arg pkgName "$PKG_NAME" --arg version "$VERSION" --slurpfile entryArr "$ENTRY_PATH" \
            '.packages[$pkgName].versions[$version] = $entryArr[0]' \
            "$WORKTREE/index.json" > "$WORKTREE/index.json.tmp"
          mv "$WORKTREE/index.json.tmp" "$WORKTREE/index.json"

          git -C "$WORKTREE" add index.json
          git -C "$WORKTREE" commit -m "Update index.json for ${{ steps.version.outputs.tag }}" || echo "No changes to commit"
          git -C "$WORKTREE" push origin gh-pages